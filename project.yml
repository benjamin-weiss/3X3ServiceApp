name: 3X3Service
options:
  bundleIdPrefix: bike.threebythree
  deploymentTarget:
    iOS: "17.0"
packages:
  ThreeByThreeKit:
    path: .
targets:
  3X3Service:
    type: application
    platform: iOS
    productName: 3X3 Service
    sources:
      - Sources/3X3ServiceApp
    dependencies:
      - package: ThreeByThreeKit
        product: ThreeByThreeKit
    settings:
      base:
        DEVELOPMENT_TEAM: GF3DY696RV
        PRODUCT_BUNDLE_IDENTIFIER: bike.threebythree.service
        PRODUCT_NAME: 3X3 Service
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 3X3 Service
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to 3X3 drivetrain and trigger devices for configuration and diagnostics.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  3X3Service:
    build:
      targets:
        3X3Service: all
    run:
      config: Debug
    archive:
      config: Release